services:
  redis:
    image: redis:8-alpine
    cpus: ${REDIS_CPUS:-0.25}
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      IOPAINT_BASE_URL: ${IOPAINT_BASE_URL:-http://iopaint:8081}
      IOPAINT_HEALTH_PATH: ${IOPAINT_HEALTH_PATH:-/docs}
      IOPAINT_INPAINT_PATH: ${IOPAINT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_SEGMENT_PATH: ${IOPAINT_SEGMENT_PATH:-/api/v1/run_plugin_gen_mask}
      IOPAINT_SEGMENT_PLUGIN_NAME: ${IOPAINT_SEGMENT_PLUGIN_NAME:-InteractiveSeg}
      IOPAINT_TIMEOUT_SECONDS: ${IOPAINT_TIMEOUT_SECONDS:-120}
      IOPAINT_PROMPT_BASE_URL: ${IOPAINT_PROMPT_BASE_URL:-http://iopaint-diffusion:8082}
      IOPAINT_PROMPT_HEALTH_PATH: ${IOPAINT_PROMPT_HEALTH_PATH:-/docs}
      IOPAINT_PROMPT_INPAINT_PATH: ${IOPAINT_PROMPT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_PROMPT_TIMEOUT_SECONDS: ${IOPAINT_PROMPT_TIMEOUT_SECONDS:-300}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      MAX_OUTPUT_PIXELS: ${MAX_OUTPUT_PIXELS:-67108864}
      TASK_STORAGE_DIR: ${TASK_STORAGE_DIR:-/task-data}
      TASK_ARTIFACT_EXPIRES_SECONDS: ${TASK_ARTIFACT_EXPIRES_SECONDS:-3600}
      TASK_INPUT_EXPIRES_SECONDS: ${TASK_INPUT_EXPIRES_SECONDS:-86400}
      TASK_ACTIVE_EXPIRES_SECONDS: ${TASK_ACTIVE_EXPIRES_SECONDS:-86400}
      UPSCALER_MODEL_PATH: ${UPSCALER_MODEL_PATH:-/ai-models/Real-ESRGAN_x2plus.onnx}
      UPSCALER_INTRA_OP_THREADS: ${UPSCALER_INTRA_OP_THREADS:-1}
      UPSCALER_INTER_OP_THREADS: ${UPSCALER_INTER_OP_THREADS:-1}
      U2NET_HOME: ${U2NET_HOME:-/ai-models/rembg}
      TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED:-true}
      BACKEND_AI_PRELOAD_MODELS: ${BACKEND_AI_PRELOAD_MODELS:-${AI_PRELOAD_MODELS:-false}}
    cpus: ${BACKEND_CPUS:-1.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - task-data:/task-data
      - ai-models:/ai-models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "celery -A img_cleaner_backend.celery_app:celery_app worker --loglevel=INFO --concurrency=$${CELERY_WORKER_CONCURRENCY:-1}"]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      IOPAINT_BASE_URL: ${IOPAINT_BASE_URL:-http://iopaint:8081}
      IOPAINT_HEALTH_PATH: ${IOPAINT_HEALTH_PATH:-/docs}
      IOPAINT_INPAINT_PATH: ${IOPAINT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_SEGMENT_PATH: ${IOPAINT_SEGMENT_PATH:-/api/v1/run_plugin_gen_mask}
      IOPAINT_SEGMENT_PLUGIN_NAME: ${IOPAINT_SEGMENT_PLUGIN_NAME:-InteractiveSeg}
      IOPAINT_TIMEOUT_SECONDS: ${IOPAINT_TIMEOUT_SECONDS:-120}
      IOPAINT_PROMPT_BASE_URL: ${IOPAINT_PROMPT_BASE_URL:-http://iopaint-diffusion:8082}
      IOPAINT_PROMPT_HEALTH_PATH: ${IOPAINT_PROMPT_HEALTH_PATH:-/docs}
      IOPAINT_PROMPT_INPAINT_PATH: ${IOPAINT_PROMPT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_PROMPT_TIMEOUT_SECONDS: ${IOPAINT_PROMPT_TIMEOUT_SECONDS:-300}
      TASK_STORAGE_DIR: ${TASK_STORAGE_DIR:-/task-data}
      TASK_ARTIFACT_EXPIRES_SECONDS: ${TASK_ARTIFACT_EXPIRES_SECONDS:-3600}
      TASK_INPUT_EXPIRES_SECONDS: ${TASK_INPUT_EXPIRES_SECONDS:-86400}
      TASK_ACTIVE_EXPIRES_SECONDS: ${TASK_ACTIVE_EXPIRES_SECONDS:-86400}
      UPSCALER_MODEL_PATH: ${UPSCALER_MODEL_PATH:-/ai-models/Real-ESRGAN_x2plus.onnx}
      UPSCALER_INTRA_OP_THREADS: ${UPSCALER_INTRA_OP_THREADS:-1}
      UPSCALER_INTER_OP_THREADS: ${UPSCALER_INTER_OP_THREADS:-1}
      U2NET_HOME: ${U2NET_HOME:-/ai-models/rembg}
      WORKER_AI_PRELOAD_MODELS: ${WORKER_AI_PRELOAD_MODELS:-${AI_PRELOAD_MODELS:-false}}
    cpus: ${WORKER_CPUS:-2.0}
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - task-data:/task-data
      - ai-models:/ai-models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    cpus: ${FRONTEND_CPUS:-0.25}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  iopaint:
    build:
      context: .
      dockerfile: docker/iopaint/Dockerfile
    profiles:
      - iopaint
    cpus: ${IOPAINT_CPUS:-2.0}
    mem_limit: ${IOPAINT_MEMORY_LIMIT:-3g}
    ports:
      - "8081:8081"
    volumes:
      - iopaint-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 60s

  iopaint-diffusion:
    build:
      context: .
      dockerfile: docker/iopaint/Dockerfile
    profiles:
      - diffusion
    cpus: ${IOPAINT_DIFFUSION_CPUS:-4.0}
    mem_limit: ${IOPAINT_DIFFUSION_MEMORY_LIMIT:-6g}
    command:
      - iopaint
      - start
      - --model=${IOPAINT_PROMPT_MODEL:-runwayml/stable-diffusion-inpainting}
      - --device=cpu
      - --low-mem
      - --host=0.0.0.0
      - --port=8082
      - --model-dir=/models
    ports:
      - "8082:8082"
    volumes:
      - iopaint-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  iopaint-models:
  task-data:
  ai-models:
