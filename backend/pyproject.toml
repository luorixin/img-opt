[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "img-cleaner-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]==5.6.3",
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "pillow==12.2.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.38.0",
  "rembg==2.0.76",
  "onnxruntime==1.27.0",
  "onnx==1.22.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
