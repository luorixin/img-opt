services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      IOPAINT_BASE_URL: ${IOPAINT_BASE_URL:-http://iopaint:8081}
      IOPAINT_HEALTH_PATH: ${IOPAINT_HEALTH_PATH:-/docs}
      IOPAINT_INPAINT_PATH: ${IOPAINT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_TIMEOUT_SECONDS: ${IOPAINT_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  iopaint:
    build:
      context: .
      dockerfile: docker/iopaint/Dockerfile
    profiles:
      - iopaint
    ports:
      - "8081:8081"
    volumes:
      - iopaint-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  iopaint-models:
