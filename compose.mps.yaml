services:
  backend:
    environment:
      IOPAINT_BASE_URL: ${IOPAINT_BASE_URL:-http://host.docker.internal:8081}
      IOPAINT_HEALTH_PATH: ${IOPAINT_HEALTH_PATH:-/docs}
      IOPAINT_INPAINT_PATH: ${IOPAINT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_SEGMENT_PATH: ${IOPAINT_SEGMENT_PATH:-/api/v1/run_plugin_gen_mask}
      IOPAINT_SEGMENT_PLUGIN_NAME: ${IOPAINT_SEGMENT_PLUGIN_NAME:-InteractiveSeg}
      IOPAINT_TIMEOUT_SECONDS: ${IOPAINT_TIMEOUT_SECONDS:-180}
      IOPAINT_PROMPT_BASE_URL: ${IOPAINT_PROMPT_BASE_URL:-http://host.docker.internal:8082}
      IOPAINT_PROMPT_HEALTH_PATH: ${IOPAINT_PROMPT_HEALTH_PATH:-/docs}
      IOPAINT_PROMPT_INPAINT_PATH: ${IOPAINT_PROMPT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_PROMPT_TIMEOUT_SECONDS: ${IOPAINT_PROMPT_TIMEOUT_SECONDS:-300}
  worker:
    environment:
      IOPAINT_BASE_URL: ${IOPAINT_BASE_URL:-http://host.docker.internal:8081}
      IOPAINT_HEALTH_PATH: ${IOPAINT_HEALTH_PATH:-/docs}
      IOPAINT_INPAINT_PATH: ${IOPAINT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_SEGMENT_PATH: ${IOPAINT_SEGMENT_PATH:-/api/v1/run_plugin_gen_mask}
      IOPAINT_SEGMENT_PLUGIN_NAME: ${IOPAINT_SEGMENT_PLUGIN_NAME:-InteractiveSeg}
      IOPAINT_TIMEOUT_SECONDS: ${IOPAINT_TIMEOUT_SECONDS:-180}
      IOPAINT_PROMPT_BASE_URL: ${IOPAINT_PROMPT_BASE_URL:-http://host.docker.internal:8082}
      IOPAINT_PROMPT_HEALTH_PATH: ${IOPAINT_PROMPT_HEALTH_PATH:-/docs}
      IOPAINT_PROMPT_INPAINT_PATH: ${IOPAINT_PROMPT_INPAINT_PATH:-/api/v1/inpaint}
      IOPAINT_PROMPT_TIMEOUT_SECONDS: ${IOPAINT_PROMPT_TIMEOUT_SECONDS:-300}
